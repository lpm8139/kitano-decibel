<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2A44">
  <title>ロケット 受付</title>
  <!-- スマホ受付ページ。PC 以外からはこのページと /api/lobby（合言葉つき）しか見えないので、CSS・JS はここに全部入れる。 -->
  <style>
    :root { --navy: #1f2a44; --orange: #ff7a1a; --yellow: #ffd166; --line: #dfe5ef; --sub: #6b7a96; --bg: #eef3fa; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--navy); font-family: 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 14px calc(10px) ; padding-top: max(10px, env(safe-area-inset-top)); background: var(--navy); color: #fff; }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 1px; }
    .conn { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #c0392b; white-space: nowrap; }
    .conn.ok { background: #1e8e4a; }
    main { padding: 12px 12px 40px; max-width: 560px; margin: 0 auto; }
    section { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(31, 42, 68, 0.08); }
    h2 { margin: 0 0 10px; font-size: 17px; }
    h2 small { font-weight: 400; color: var(--sub); font-size: 13px; margin-left: 6px; }
    label.lbl { display: block; font-size: 13px; color: var(--sub); margin: 4px 0; }
    input[type=text] { width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; font-size: 22px; font-weight: 700; color: var(--navy); outline: none; }
    input[type=text]:focus { border-color: var(--orange); }
    .divs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .divs button { padding: 12px 4px; border: 2px solid var(--line); border-radius: 12px; background: #f7f9fc; font-size: 17px; font-weight: 700; color: var(--navy); }
    .divs button.on { background: var(--yellow); border-color: #e9b440; }
    .divs.small { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    .divs.small button { padding: 8px 2px; font-size: 13px; border-radius: 10px; }
    .primary { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 14px; background: var(--orange); color: #fff; font-size: 20px; font-weight: 900; }
    .primary:disabled { opacity: 0.4; }
    .sub-btn { padding: 8px 12px; border: 0; border-radius: 10px; background: #e3e8f0; color: var(--navy); font-size: 14px; font-weight: 700; white-space: nowrap; }
    .sub-btn.save { background: #2f6fed; color: #fff; }
    .sub-btn.danger { background: #ffe3e3; color: #c0392b; }
    ol.queue { margin: 0; padding: 0; list-style: none; }
    ol.queue li { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
    ol.queue li:last-child { border-bottom: 0; }
    .no { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--orange); color: #fff; text-align: center; line-height: 30px; font-weight: 900; }
    li:first-child .no { background: #1e8e4a; }
    .qn { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qd { font-size: 13px; color: var(--sub); margin-left: 4px; font-weight: 400; }
    .empty { color: var(--sub); font-size: 14px; padding: 6px 0; }
    .res { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .res:last-child { border-bottom: 0; }
    .res.latest { background: #fff8e6; margin: 0 -14px; padding: 12px 14px; }
    .res-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .res-score { font-size: 24px; font-weight: 900; color: var(--orange); }
    .res-place { font-size: 14px; color: var(--sub); }
    .res-time { margin-left: auto; font-size: 12px; color: var(--sub); }
    .res-row { display: flex; gap: 8px; }
    .res-row input[type=text] { font-size: 18px; padding: 8px 10px; }
    .badge-new { font-size: 12px; background: #ff5a5f; color: #fff; padding: 2px 8px; border-radius: 999px; }
    .saved { font-size: 13px; color: #1e8e4a; margin-top: 6px; min-height: 1em; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 12px; background: rgba(20, 24, 48, 0.94);
      color: #fff; font-size: 15px; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 90vw; }
    .toast.on { opacity: 1; }
    .keybox { display: none; }
    .keybox.on { display: block; }
    .note { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>🚀 ロケット 受付</h1>
    <span id="conn" class="conn">つながっていません</span>
  </header>
  <main>
    <section id="keybox" class="keybox">
      <h2>合言葉を入れてください</h2>
      <input id="key" type="text" inputmode="text" autocomplete="off" autocapitalize="off" placeholder="PC の管理者画面に出ています">
      <button id="key-save" class="primary" type="button">つなぐ</button>
    </section>

    <section>
      <h2>じゅんばんまち に いれる</h2>
      <label class="lbl" for="name">なまえ（なくてもOK）</label>
      <input id="name" type="text" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="はると">
      <div id="divs" class="divs">
        <button type="button" data-div="k">ようちえん</button>
        <button type="button" data-div="low">1〜3ねんせい</button>
        <button type="button" data-div="high">4〜6ねんせい</button>
        <button type="button" data-div="adult">おとな</button>
      </div>
      <button id="add" class="primary" type="button" disabled>とうろく</button>
      <div class="note">ぶもんを えらぶと、その ぶもんの 1い・へいきんと きょうそう できます。</div>
    </section>

    <section>
      <h2>じゅんばんまち <small id="qcount"></small></h2>
      <ol id="queue" class="queue"></ol>
    </section>

    <section>
      <h2>さいきんの けっか <small>なまえ・ぶもんを あとから なおせます</small></h2>
      <div id="recent"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    'use strict';
    // ---- 設定 ----
    var POLL_MS = 1000;
    var KEY_STORE = 'kitano-decibel:phone-key';
    var DIV = { k: 'ようちえん', low: '1〜3ねんせい', high: '4〜6ねんせい', adult: 'おとな' };
    var PLACE = { earth: 'ちきゅう', cloud: 'くも', space: 'うちゅう', moon: 'つき', mars: 'かせい', jupiter: 'もくせい', saturn: 'どせい',
      uranus: 'てんのうせい', neptune: 'かいおうせい', edge: 'たいようけいの はて', galaxy: 'ぎんがの かなた' };

    var $ = function (id) { return document.getElementById(id); };
    var lobby = { rev: -1, queue: [], recent: [] };
    var division = '';
    var lastSeenRecent = null;
    var toastTimer = null;

    // ---- 合言葉（URL の ?k= → 保存。次からは /phone だけで開ける） ----
    function readKey() {
      var m = /[?&]k=([a-z0-9]+)/.exec(location.search);
      if (m) {
        try { localStorage.setItem(KEY_STORE, m[1]); } catch (e) { /* 保存できなくても動く */ }
        return m[1];
      }
      try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; }
    }
    var key = readKey();
    if (!key) $('keybox').classList.add('on');
    $('key-save').addEventListener('click', function () {
      key = $('key').value.trim().toLowerCase();
      try { localStorage.setItem(KEY_STORE, key); } catch (e) { /* noop */ }
      $('keybox').classList.remove('on');
      poll();
    });

    function toast(text) {
      var t = $('toast');
      t.textContent = text;
      t.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2500);
    }

    function setConn(ok, text) {
      var c = $('conn');
      c.className = 'conn' + (ok ? ' ok' : '');
      c.textContent = text || (ok ? 'つながっています' : 'つながっていません');
    }

    // ---- 通信 ----
    function api(body) {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 5000);
      return fetch('/api/lobby?k=' + encodeURIComponent(key), {
        method: body ? 'POST' : 'GET',
        headers: Object.assign({ 'X-Kitano-Key': key }, body ? { 'Content-Type': 'application/json' } : {}),
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store',
        signal: ctrl ? ctrl.signal : undefined,
      }).then(function (res) {
        clearTimeout(timer);
        if (res.status === 403) {
          setConn(false, '合言葉がちがいます');
          $('keybox').classList.add('on');
          throw new Error('forbidden');
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (lb) {
        setConn(true);
        accept(lb);
        return lb;
      }, function (e) {
        clearTimeout(timer);
        if (e.message !== 'forbidden') setConn(false);
        throw e;
      });
    }

    function poll() {
      if (!key) return;
      api(null).catch(function () {}).then(function () { /* noop */ });
    }
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
    poll();

    // ---- 登録 ----
    function updateAddButton() {
      $('add').disabled = !($('name').value.trim() || division);
    }
    $('name').addEventListener('input', updateAddButton);
    $('name').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('name').blur(); }
    });
    $('divs').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-div]');
      if (!b) return;
      division = division === b.dataset.div ? '' : b.dataset.div;
      Array.prototype.forEach.call($('divs').querySelectorAll('button'), function (x) { x.classList.toggle('on', x.dataset.div === division); });
      updateAddButton();
    });
    $('add').addEventListener('click', function () {
      var name = $('name').value.trim();
      if (!name && !division) return;
      $('add').disabled = true;
      api({ op: 'add', name: name, division: division }).then(function (lb) {
        toast((name || 'ななし') + ' さんを とうろくしました（' + lb.queue.length + ' ばんめ）');
        $('name').value = '';
        // 部門は続けて同じ子が来やすいので残す
        updateAddButton();
      }, function () {
        toast('とうろく できませんでした。もういちど おしてください');
        updateAddButton();
      });
    });

    // ---- 表示 ----
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function accept(lb) {
      if (!lb || !Array.isArray(lb.queue) || lb.rev === lobby.rev) return;
      lobby = { rev: lb.rev, queue: lb.queue, recent: Array.isArray(lb.recent) ? lb.recent : [] };
      renderQueue();
      renderRecent();
    }

    function renderQueue() {
      var ol = $('queue');
      ol.textContent = '';
      $('qcount').textContent = lobby.queue.length ? lobby.queue.length + ' にん' : '';
      if (!lobby.queue.length) {
        ol.appendChild(el('li', 'empty', 'いま まっている人は いません'));
        return;
      }
      lobby.queue.forEach(function (q, i) {
        var li = el('li');
        li.appendChild(el('span', 'no', String(i + 1)));
        var n = el('span', 'qn', q.name || 'ななし');
        if (q.division) n.appendChild(el('span', 'qd', DIV[q.division] || ''));
        li.appendChild(n);
        var del = el('button', 'sub-btn danger', 'とりけし');
        del.type = 'button';
        del.addEventListener('click', function () {
          api({ op: 'remove', id: q.id }).then(function () { toast('とりけしました'); }, function () { toast('とりけせませんでした'); });
        });
        li.appendChild(del);
        ol.appendChild(li);
      });
    }

    // 入力中の行は作り直さない（打っている途中の文字が消えないように）
    var recentRows = {};
    function renderRecent() {
      var box = $('recent');
      var list = lobby.recent.slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
      var newest = list[0] ? list[0].recordId : null;
      if (newest && lastSeenRecent !== null && newest !== lastSeenRecent) toast('あたらしい けっか: ' + Math.round(list[0].score || 0) + ' km');
      lastSeenRecent = newest;
      var keep = {};
      list.forEach(function (r) {
        var row = recentRows[r.recordId] || makeRow(r);
        row.update(r);
        row.root.classList.toggle('latest', r.recordId === newest);
        keep[r.recordId] = row;
      });
      // 消えた行・空の案内を外す
      Array.prototype.slice.call(box.children).forEach(function (c) {
        if (!list.some(function (r) { return keep[r.recordId].root === c; })) box.removeChild(c);
      });
      if (!list.length) box.appendChild(el('div', 'empty', 'まだ けっかは ありません'));
      // 並び順どおりに。すでに正しい位置にある行は動かさない（動かすと入力中のフォーカスが外れる）
      list.forEach(function (r, i) {
        var root = keep[r.recordId].root;
        if (box.children[i] !== root) box.insertBefore(root, box.children[i] || null);
      });
      recentRows = keep;
    }

    function makeRow(r) {
      var root = el('div', 'res');
      var head = el('div', 'res-head');
      var score = el('span', 'res-score');
      var place = el('span', 'res-place');
      var time = el('span', 'res-time');
      head.appendChild(score); head.appendChild(place); head.appendChild(time);
      var line = el('div', 'res-row');
      var input = el('input');
      input.type = 'text'; input.maxLength = 20; input.placeholder = 'なまえ'; input.setAttribute('enterkeyhint', 'done');
      var save = el('button', 'sub-btn save', 'なおす');
      save.type = 'button';
      line.appendChild(input); line.appendChild(save);
      var divs = el('div', 'divs small');
      Object.keys(DIV).forEach(function (k) {
        var b = el('button', '', DIV[k].replace('ねんせい', 'ねん'));
        b.type = 'button'; b.dataset.div = k;
        divs.appendChild(b);
      });
      var msg = el('div', 'saved');
      root.appendChild(head); root.appendChild(line); root.appendChild(divs); root.appendChild(msg);

      var state = { id: r.recordId, division: r.division || '', dirty: false, serverAt: 0 };
      function paintDivs() {
        Array.prototype.forEach.call(divs.querySelectorAll('button'), function (x) { x.classList.toggle('on', x.dataset.div === state.division); });
      }
      function send() {
        save.disabled = true;
        api({ op: 'edit', recordId: state.id, name: input.value.trim(), division: state.division }).then(function () {
          state.dirty = false;
          msg.textContent = 'PC に はんえい しました ✓';
          save.disabled = false;
        }, function () {
          msg.textContent = 'おくれませんでした。もういちど おしてください';
          save.disabled = false;
        });
      }
      input.addEventListener('input', function () { state.dirty = true; msg.textContent = ''; });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(); input.blur(); } });
      save.addEventListener('click', send);
      divs.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-div]');
        if (!b) return;
        state.division = state.division === b.dataset.div ? '' : b.dataset.div;
        paintDivs();
        send(); // 部門はボタンを押したらすぐ送る
      });

      return {
        root: root,
        update: function (x) {
          score.textContent = Math.round(Number(x.score) || 0).toLocaleString('ja-JP') + ' km';
          place.textContent = PLACE[x.reached] ? PLACE[x.reached] + ' まで' : '';
          var d = new Date(x.ts || Date.now());
          time.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
          // 入力中・送信前の行は、サーバーの値で上書きしない
          if (!state.dirty && document.activeElement !== input && (x.updatedAt || 0) !== state.serverAt) {
            input.value = x.name || '';
            state.division = x.division || '';
            paintDivs();
          }
          state.serverAt = x.updatedAt || 0;
        },
      };
    }
  </script>
</body>
</html>
